<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: var(--font-sans);
  }

  .wrap {
    padding: 16px 0;
  }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .tab {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    border: 1.5px solid var(--color-border-secondary);
    color: var(--color-text-secondary);
    background: transparent;
    font-family: var(--font-sans);
    transition: all .15s;
  }

  .tab.active {
    color: #fff;
    border-color: transparent;
  }

  .tab[data-g="public"].active {
    background: #3B8BD4;
  }

  .tab[data-g="developer"].active {
    background: #1D9E75;
  }

  .tab[data-g="employer"].active {
    background: #BA7517;
  }

  .tab[data-g="admin"].active {
    background: #7F77DD;
  }

  .legend {
    display: flex;
    gap: 16px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .leg {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--color-text-secondary);
  }

  .leg-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .grid {
    display: grid;
    gap: 10px;
  }

  .screen {
    border: 1.5px solid var(--color-border-tertiary);
    border-radius: 10px;
    padding: 12px 14px;
    background: var(--color-background-secondary);
  }

  .screen-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .screen-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--color-text-primary);
  }

  .screen-path {
    font-size: 11px;
    color: var(--color-text-tertiary);
    font-family: var(--font-mono);
  }

  .navs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    border: none;
    font-family: var(--font-sans);
    transition: opacity .15s;
  }

  .nav-btn:hover {
    opacity: .75;
  }

  .nav-btn .arrow {
    font-size: 10px;
    opacity: .7;
  }

  .note {
    font-size: 11px;
    color: var(--color-text-tertiary);
    margin-top: 6px;
    font-style: italic;
  }

  .highlight {
    border-color: #3B8BD4;
    background: rgba(59, 139, 212, .06);
  }

  .section-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--color-text-tertiary);
    text-transform: uppercase;
    letter-spacing: .06em;
    margin: 14px 0 6px;
  }
</style>
<div class="wrap">
  <div class="tabs">
    <button class="tab active" data-g="public" onclick="show('public')">🌐 Public</button>
    <button class="tab" data-g="developer" onclick="show('developer')">👨‍💻 Developer</button>
    <button class="tab" data-g="employer" onclick="show('employer')">🏢 Employer</button>
    <button class="tab" data-g="admin" onclick="show('admin')">🛡️ Admin</button>
  </div>
  <div class="legend">
    <div class="leg">
      <div class="leg-dot" style="background:#3B8BD4"></div> Goes to public screen
    </div>
    <div class="leg">
      <div class="leg-dot" style="background:#1D9E75"></div> Goes to developer screen
    </div>
    <div class="leg">
      <div class="leg-dot" style="background:#BA7517"></div> Goes to employer screen
    </div>
    <div class="leg">
      <div class="leg-dot" style="background:#7F77DD"></div> Goes to admin screen
    </div>
    <div class="leg">
      <div class="leg-dot" style="background:#D85A30"></div> Redirects / guard
    </div>
  </div>
  <div id="content"></div>
</div>

  function show(group) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.g === group));
    const list = screens[group];
    const c = document.getElementById('content');
    c.innerHTML = '';
    list.forEach(s => {
      const d = document.createElement('div');
      d.className = 'screen';
      d.innerHTML = `
      <div class="screen-header">
        <div>
          <div class="screen-title">${s.title}</div>
          <div class="screen-path">${s.path}</div>
        </div>
      </div>
      <div class="navs">${s.navs.join('')}</div>
      ${s.note ? `<div class="note">${s.note}</div>` : ''}
    `;
      c.appendChild(d);
    });
  }
  show('public');
</script>
