<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Identity Verification History</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #333;
            margin: 30px;
            font-size: 12px;
        }
        .meta-bar {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        table.data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        table.data-table th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: bold;
            text-align: left;
            padding: 12px;
            border-bottom: 2px solid #e2e8f0;
            font-size: 11px;
            text-transform: uppercase;
        }
        table.data-table td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 12px;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            display: inline-block;
        }
        .status-approved { background-color: #dcfce7; color: #166534; }
        .status-under_review { background-color: #fef9c3; color: #854d0e; }
        .status-rejected { background-color: #fee2e2; color: #991b1b; }
        .footer {
            margin-top: 40px;
            padding-top: 15px;
            border-top: 2px solid #e2e8f0;
            text-align: center;
        }
        .footer-cta {
            color: #0284c7;
            font-weight: bold;
            font-size: 13px;
            margin: 0 0 4px 0;
        }
        .footer-sub {
            color: #94a3b8;
            font-size: 9px;
            margin: 0;
        }
    </style>
</head>
<body>
    <!-- Branded Header -->
    <table style="width: 100%; border: none; border-collapse: collapse; margin-bottom: 15px;">
        <tr style="border: none;">
            <td style="border: none; width: 60%; padding: 0; text-align: left; vertical-align: middle;">
                <img th:if="${base64Logo != null and !base64Logo.isEmpty()}" th:src="${base64Logo}" style="max-height: 45px; display: inline-block; vertical-align: middle;" />
                <span style="font-size: 22px; font-weight: bold; color: #0f172a; margin-left: 10px; display: inline-block; vertical-align: middle;" th:text="${companyName}">KEDevs</span>
            </td>
            <td style="border: none; width: 40%; padding: 0; text-align: right; vertical-align: middle; color: #64748b; font-size: 11px;">
                <div>Export Date: <strong th:text="${dateOfExport}">2026-05-14</strong></div>
                <div style="font-weight: bold; color: #0f172a; margin-top: 2px; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px;">Identity Verification Audit</div>
            </td>
        </tr>
    </table>

    <!-- Active Filters Metadata -->
    <div class="meta-bar">
        <span style="font-weight: bold; color: #475569; font-size: 10px; text-transform: uppercase;">Report Scope:</span>
        <span style="color: #1e293b; font-size: 11px; margin-left: 5px;" th:text="${filterSummary}">None</span>
    </div>

    <table class="data-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Applicant</th>
                <th>Classification</th>
                <th>Artifacts</th>
                <th>Final State</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="req : ${requests}">
                <td th:text="${#temporals.format(req.createdAt, 'dd MMM yyyy')}">Date</td>
                <td style="font-weight: bold;" th:text="${req.userName}">User Name</td>
                <td th:text="${req.role}">Role</td>
                <td th:text="${(req.idDocumentUrl != null ? 1 : 0) + (req.certificateUrls != null ? req.certificateUrls.size() : 0) + ' Files'}">0 Files</td>
                <td>
                    <span th:class="${'badge status-' + #strings.toLowerCase(req.status)}" th:text="${req.status}">Status</span>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Branded Footer CTA -->
    <div class="footer">
        <p class="footer-cta">Empowering Kenya's Tech Ecosystem. Join KEDevs today!</p>
        <p class="footer-sub">&copy; 2026 KEDevs-Connect. Official Administrative Audit Record.</p>
    </div>
</body>
</html>
