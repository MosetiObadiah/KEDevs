spring.application.name=KEDevs-api

# spring-dotenv: load .env from project root (one level above KEDevs-api/ working dir)
# This covers IDE runs and direct mvn invocations; start.sh also sources .env via set -a.
springdotenv.directory=../

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/kedevs_db
spring.datasource.username=moseti
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# App
server.port=8080
app.api-base-url=http://localhost:8080

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# Email Brevo
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=abe9ee001@smtp-brevo.com
spring.mail.password=${BREVO_API_KEY}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=mosetioba01@gmail.com

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# Daraja M-Pesa
daraja.consumer.key=${DARAJA_CONSUMER_KEY}
daraja.consumer.secret=${DARAJA_CONSUMER_SECRET}
daraja.shortcode=${DARAJA_SHORTCODE:174379}
daraja.passkey=${DARAJA_PASSKEY}
daraja.callback.url=https://monogamy-revoke-treble.ngrok-free.dev/api/v1/payments/callback

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Auth cookies — set SECURE_COOKIES=false in .env for local HTTP dev
auth.cookies.secure=${SECURE_COOKIES:true}

# SpringDoc OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# Cloudinary file upload
cloudinary.cloud-name=dzouazisv
cloudinary.api-key=637318845456116
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Multipart config
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Cache (global TTL: 5 minutes)
spring.cache.redis.time-to-live=300000
