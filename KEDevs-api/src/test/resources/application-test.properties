spring.application.name=KEDevs-api-test

# Database - TestContainers will override these
spring.datasource.url=jdbc:tc:postgresql:17-alpine:///kedevs_test_db
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

# JPA / Hibernate - Use create-drop for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway - Disabled for tests (using create-drop)
spring.flyway.enabled=false

# JWT - Test configuration
jwt.secret=test-secret-key-for-integration-tests-must-be-at-least-256-bits-long-for-proper-security
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# Email - Will be mocked in tests
spring.mail.host=localhost
spring.mail.port=1025

# Server
server.port=0

# Logging
logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN
logging.level.org.hibernate.SQL=DEBUG

